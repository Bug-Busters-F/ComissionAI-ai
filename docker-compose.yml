services:
  ai:
    build:
      context: .
      args:
        LLM_SDK: ${LLM_SDK:-google-genai}
    container_name: bugbusters-ai
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped

